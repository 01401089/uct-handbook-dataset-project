appearance:
  default: system
  switcher: true

# Validated categorical palette (dataviz reference instance, slots 1-8).
# Faculty colors are assigned in FIXED order — COM, EBE, LAW, FHS, SCI, HUM —
# and charts that color by faculty pass an explicit seriesColors map so a
# filtered chart never repaints the survivors.
theme:
  colorPalettes:
    default:
      light:
        - "#2a78d6"   # COM  blue
        - "#eb6834"   # EBE  orange
        - "#1baf7a"   # LAW  aqua
        - "#eda100"   # FHS  yellow
        - "#e87ba4"   # SCI  magenta
        - "#008300"   # HUM  green
        - "#4a3aa7"   # spare violet
        - "#e34948"   # spare red
      dark:
        - "#3987e5"
        - "#d95926"
        - "#199e70"
        - "#c98500"
        - "#d55181"
        - "#008300"
        - "#9085e9"
        - "#e66767"
  colorScales:
    default:
      light:
        - "#cde2fb"
        - "#0d366b"
      dark:
        - "#104281"
        - "#9ec5f4"
  colors:
    primary:
      light: "#2a78d6"
      dark: "#3987e5"
    accent:
      light: "#eb6834"
      dark: "#d95926"
    info:
      light: "#256abf"
      dark: "#86b6ef"
    positive:
      light: "#0ca30c"
      dark: "#0ca30c"
    warning:
      light: "#fab219"
      dark: "#fab219"
    negative:
      light: "#d03b3b"
      dark: "#d03b3b"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }
